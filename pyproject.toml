[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lagos-flood"
version = "0.1.0"
description = "Per-LGA multi-class flood-risk forecasting for Lagos State, Nigeria"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jennifer Maduechesi" }]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # FloodScan arrives from HDX as .xlsx, so this is core, not optional.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
explain = ["shap>=0.44", "matplotlib>=3.7"]
imbalance = ["imbalanced-learn>=0.11"]
geo = ["geopandas>=0.14", "xarray>=2023.1", "rioxarray>=0.15", "exactextract>=0.2", "netCDF4>=1.6"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]
all = ["lagos-flood[boosting,explain,imbalance,geo,dev]"]

[project.scripts]
lagos-flood = "lagos_flood.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
